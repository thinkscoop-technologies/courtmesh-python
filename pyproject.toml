[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "courtmesh"
version = "0.3.0"
description = "Python SDK for the CourtMesh API: Indian case law search, case details, AI analysis and document timelines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Thinkscoop Technologies LLP", email = "krishan@thinkscoopinc.com" },
]
keywords = ["courtmesh", "legal", "case law", "india", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://research.courtmesh.ai"
Repository = "https://github.com/courtmesh/courtmesh-python"
Issues = "https://github.com/courtmesh/courtmesh-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/courtmesh"]

[tool.hatch.build.targets.sdist]
include = [
    "src/courtmesh",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
